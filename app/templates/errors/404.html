{% extends 'base.html' %}
{% block title %}Page Not Found (404) - Apex Academy{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="py-5">
        <i class="fa-solid fa-compass-drafting text-warning display-1 mb-3"></i>
        <h1 class="display-4 fw-bold">404 - Page Not Found</h1>
        <p class="lead text-muted max-w-md mx-auto">Oops! The requested page could not be located. It might have been moved or renamed.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-custom-primary mt-3">Return to Homepage</a>
    </div>
</div>
{% endblock %}
