{% extends 'base.html' %}
{% block title %}Server Error (500) - Apex Academy{% endblock %}
{% block content %}

        <i class="fa-solid fa-triangle-exclamation text-warning display-1 mb-3"></i>

    </div>
</div>
{% endblock %}
