{% extends 'admin_base.html' %}
{% block title %}Record Fee Payment{% endblock %}
{% block header_title %}Record Student Fee Collection{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <h4 class="fw-bold text-dark mb-4"><i class="fa-solid fa-cash-register me-2 text-success"></i> Collect Fee Payment</h4>

            <form method="POST" action="{{ url_for('fee.pay') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Select Student *</label>
                    <select name="student_id" class="form-select form-select-lg" required>
                        <option value="">-- Choose Student --</option>
                        {% for s in students %}
                            <option value="{{ s.id }}">{{ s.full_name }} ({{ s.admission_number }} - {{ s.class_obj.name }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Fee Structure Category *</label>
                    <select name="fee_structure_id" class="form-select" required>
                        {% for fs in structures %}
                            <option value="{{ fs.id }}">{{ fs.category_obj.name }} - Class: {{ fs.class_obj.name }} (${{ fs.amount }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Amount Paid ($) *</label>
                        <input type="number" step="0.01" name="amount_paid" class="form-control form-control-lg" placeholder="1500.00" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Payment Mode *</label>
                        <select name="payment_mode" class="form-select form-select-lg">
                            <option value="Cash">Cash</option>
                            <option value="Online">Online / Card</option>
                            <option value="Cheque">Cheque</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Transaction ID / Cheque #</label>
                    <input type="text" name="transaction_id" class="form-control" placeholder="TXN-998811">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Payment Remarks</label>
                    <input type="text" name="remarks" class="form-control" placeholder="Term 1 Fee Paid">
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Process Payment & Generate Receipt</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
