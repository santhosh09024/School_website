{% extends 'admin_base.html' %}
{% block title %}School Settings{% endblock %}
{% block header_title %}System & School Settings Configuration{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
            <h4 class="fw-bold text-dark mb-4"><i class="fa-solid fa-gear me-2 text-primary"></i> General School Settings</h4>

            <form method="POST" action="{{ url_for('admin.settings') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">School Name *</label>
                        <input type="text" name="school_name" class="form-control" value="{{ settings.get('school_name', '') }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tagline / Motto</label>
                        <input type="text" name="tagline" class="form-control" value="{{ settings.get('tagline', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Phone Numbers *</label>
                        <input type="text" name="phone" class="form-control" value="{{ settings.get('phone', '') }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email Address *</label>
                        <input type="email" name="email" class="form-control" value="{{ settings.get('email', '') }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Principal Name *</label>
                        <input type="text" name="principal_name" class="form-control" value="{{ settings.get('principal_name', '') }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Chairman Name</label>
                        <input type="text" name="chairman_name" class="form-control" value="{{ settings.get('chairman_name', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Current Academic Year</label>
                        <input type="text" name="academic_year" class="form-control" value="{{ settings.get('academic_year', '2025-2026') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Office Hours</label>
                        <input type="text" name="office_hours" class="form-control" value="{{ settings.get('office_hours', '') }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Campus Address *</label>
                        <input type="text" name="address" class="form-control" value="{{ settings.get('address', '') }}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Footer Copyright Text</label>
                        <input type="text" name="footer_text" class="form-control" value="{{ settings.get('footer_text', '') }}">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg fw-bold px-4">Update School Settings</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
